[workspace.package]
version = "0.7.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/uniproc-dev/guinea-plugins"

[workspace]
resolver = "2"
members = ["plugins/*", "widgets"]

[workspace.dependencies]
# Pinned to a rev: the plugin API is still moving, and a plugin is usually
# written in the same sitting as the `guinea::app` change it needs. An
# application consuming both from git must patch them to the same rev, or it
# ends up with two copies of guinea and two incompatible `PluginBuilder`s.
guinea = { git = "https://github.com/uniproc-dev/guinea", tag = "v0.7.1" }
guinea-core = { git = "https://github.com/uniproc-dev/guinea", tag = "v0.7.1" }

anyhow = "1.0.100"
tracing = "0.1.44"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# The guinea next door, while its half of a change is still unreleased. Drop
# it once the tag above carries that half.
[patch."https://github.com/uniproc-dev/guinea"]
guinea = { path = "../guinea/crates/guinea" }
guinea-core = { path = "../guinea/crates/guinea-core" }

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0
