[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/uniproc-dev/guinea-plugins"

[workspace]
resolver = "2"
members = ["plugins/*"]

[workspace.dependencies]
# Path, not git, while guinea's plugin API is still moving - a plugin here is
# usually written in the same sitting as the `guinea::app` change it needs.
guinea = { path = "../guinea/crates/guinea" }
guinea-core = { path = "../guinea/crates/guinea-core" }

anyhow = "1.0.100"
tracing = "0.1.44"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0
