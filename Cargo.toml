[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/uniproc-dev/guinea-plugins"

[workspace]
resolver = "2"
members = ["plugins/*", "widgets"]

[workspace.dependencies]
guinea = "0.16.0"
guinea-core = "0.16.0"
guinea-mark = "0.16.0"

windows-reactor = { package = "windows-reactor-pre", version = "0.100.0" }
windows-canvas = { package = "windows-canvas-pre", version = "0.100.0" }
windows-core = "0.100.0"

anyhow = "1.0.100"
tracing = "0.1.44"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0
