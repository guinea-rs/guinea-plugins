[package]
name = "guinea-devtools-cli"
description = "guinea devtools in a terminal, over their HTTP API"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "guinea-devtools-cli"
path = "src/main.rs"

[dependencies]
guinea-devtools-model = { path = "../model" }
ureq = { version = "2.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
