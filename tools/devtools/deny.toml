[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc macro of compio-driver, which the hub and ogurpchik run on" },
    { id = "RUSTSEC-2026-0370", reason = "Temporary maintenance-risk exception for zvariant 5.15 via egui 0.36/accesskit/atspi and zbus 5; no patched standalone release exists. Replacing it requires upstream migration to zbus 6, not a lock-only update. Keep Linux accessibility enabled; review by 2026-11-20 or when that upstream stack migrates (https://github.com/z-galaxy/zbus/issues/2043). Vulnerability advisories remain enforced." },
    { id = "RUSTSEC-2026-0371", reason = "Temporary maintenance-risk exception for zbus_names 4.3.4 via egui 0.36/accesskit/atspi and zbus 5; no patched standalone release exists. Replacing it requires upstream migration to zbus 6, not a lock-only update. Keep Linux accessibility enabled; review by 2026-11-20 or when that upstream stack migrates (https://github.com/z-galaxy/zbus/issues/2043). Vulnerability advisories remain enforced." },
    { id = "RUSTSEC-2026-0372", reason = "Temporary maintenance-risk exception for zvariant_derive 5.15 via zvariant 5.15 in the egui 0.36/accesskit/atspi stack; no patched standalone release exists. Its macros move into zbus 6, requiring upstream migration. Review by 2026-11-20 or when that upstream stack migrates (https://github.com/z-galaxy/zbus/issues/2043). Vulnerability advisories remain enforced." },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = [
    { crate = "windows", reason = "0.61 from guinea, 0.100 from ogurpchik's git windows-rs" },
    { crate = "windows-sys", reason = "every platform crate pins its own" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/microsoft/windows-rs"]

[sources.allow-org]
github = ["guinea-rs", "uniproc-dev"]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
ignore = true
