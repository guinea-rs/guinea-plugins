[package]
name = "guinea-devtools-mcp"
description = "guinea devtools as MCP tools, one per route of their HTTP API"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[[bin]]
name = "guinea-devtools-mcp"
path = "src/main.rs"

[dependencies]
guinea-devtools-api = { path = "../api" }
guinea-devtools-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false }
anyhow = "1.0"
