[package]
name = "guinea-devtools-api"
description = "The devtools HTTP API: its routes, its OpenAPI document, and what reads both"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
guinea-devtools-model = { path = "../model" }
guinea-devtools-protocol = { path = "../../../plugins/devtools-protocol" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1.2"
tokio = { version = "1", features = ["time"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
