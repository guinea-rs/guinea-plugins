[package]
name = "guinea-devtools-model"
description = "What guinea devtools make of what applications report, with no UI in it"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
guinea-devtools-protocol = { path = "../../../plugins/devtools-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csscolorparser = "0.7"
