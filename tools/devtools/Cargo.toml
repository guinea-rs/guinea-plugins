[package]
name = "guinea-devtools"
description = "Looks inside running guinea applications"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]
members = ["model", "api", "hub", "mcp", "xaml-tap"]

[dependencies]
guinea-devtools-model = { path = "model" }
guinea-devtools-api = { path = "api" }
guinea-devtools-hub = { path = "hub" }
guinea = { version = "0.19.0", default-features = false, features = ["eframe"] }
guinea-core = "0.19.0"
guinea-macros = "0.19.0"
guinea-devtools-protocol = { path = "../../plugins/devtools-protocol" }
guinea-plugin-store = { path = "../../plugins/store" }
guinea-plugin-single-instance = { path = "../../plugins/single-instance" }
amethystate = { version = "0.23.0", features = ["json"] }
serde = { version = "1", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
guicons = { git = "https://github.com/uniproc-dev/guicons", rev = "44b5d06", default-features = false, features = ["macros", "egui"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
inventory = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
guinea-xaml-tap = { path = "xaml-tap" }

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
guinea = { path = "../../../guinea/crates/guinea" }
guinea-app = { path = "../../../guinea/crates/guinea-app" }
guinea-codegen = { path = "../../../guinea/crates/guinea-codegen" }
guinea-core = { path = "../../../guinea/crates/guinea-core" }
guinea-eframe = { path = "../../../guinea/crates/adapters/guinea-eframe" }
guinea-macros = { path = "../../../guinea/crates/guinea-macros" }
guinea-mark = { path = "../../../guinea/crates/guinea-mark" }
guinea-meta = { path = "../../../guinea/crates/guinea-meta" }
guinea-meta-build = { path = "../../../guinea/crates/guinea-meta-build" }
guinea-route-dsl = { path = "../../../guinea/crates/guinea-route-dsl" }
guinea-router = { path = "../../../guinea/crates/guinea-router" }
guinea-trace = { path = "../../../guinea/crates/guinea-trace" }
guinea-winui = { path = "../../../guinea/crates/adapters/guinea-winui" }
windows-reactor-pre = { path = "../../../guinea/crates/vendor/windows-reactor-pre" }
windows-canvas-pre = { path = "../../../guinea/crates/vendor/windows-canvas-pre" }
