[package]
name = "guinea-devtools"
description = "Looks inside running guinea applications"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]
members = ["model", "api", "hub", "mcp", "xaml-tap"]

[profile.dev]
debug = 1

[dependencies]
guinea-devtools-model = { path = "model" }
guinea-devtools-api = { path = "api" }
guinea-devtools-hub = { path = "hub" }
guinea = { version = "0.31.1", default-features = false, features = ["eframe"] }
guinea-devtools-protocol = { path = "../../plugins/devtools-protocol" }
guinea-plugin-store = { path = "../../plugins/store" }
guinea-plugin-single-instance = { path = "../../plugins/single-instance" }
amethystate = { version = "0.28.0", features = ["json"] }
serde = { version = "1", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
guicons = { version = "0.14.1", default-features = false, features = ["macros", "egui"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
inventory = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
guinea-xaml-tap = { path = "xaml-tap" }

[build-dependencies]
winresource = "0.1"
