[package]
name = "guinea-devtools-hub"
description = "Where applications report to guinea devtools, and the HTTP API over what they reported"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
guinea-devtools-api = { path = "../api" }
guinea-devtools-model = { path = "../model" }
guinea-devtools-protocol = { path = "../../../plugins/devtools-protocol" }
ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.5.1" }
capnp = "0.27"
compio = { version = "0.18.0", features = ["runtime"] }
futures = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net"] }
getrandom = "0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
guinea-xaml-tap = { path = "../xaml-tap" }
