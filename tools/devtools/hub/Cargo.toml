[package]
name = "guinea-devtools-hub"
description = "Where applications report to guinea devtools, and the HTTP API over what they reported"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
guinea-devtools-model = { path = "../model" }
guinea-devtools-protocol = { path = "../../../plugins/devtools-protocol" }
ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.4.0" }
capnp = "0.27"
compio = { version = "0.18.0", features = ["runtime"] }
tiny_http = "0.12"
form_urlencoded = "1.2"
getrandom = "0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
