[defaults]
paint = "#ffffff"

[everything]
iconify = "tabler:stack-2"

[records]
iconify = "tabler:list"

[action]
iconify = "tabler:bolt"

[timer]
iconify = "tabler:clock"

[source]
iconify = "tabler:transfer-in"

[repeat]
iconify = "tabler:repeat"

[navigation]
iconify = "tabler:route"

[store]
iconify = "tabler:database"

[log]
iconify = "tabler:notes"

[loose]
iconify = "tabler:help-circle"

[error]
iconify = "tabler:alert-octagon"

[warn]
iconify = "tabler:alert-triangle"

[info]
iconify = "tabler:info-circle"

[debug]
iconify = "tabler:bug"

[trace]
iconify = "tabler:dots"

[slow]
iconify = "tabler:gauge"

[close]
iconify = "tabler:x"

[search]
iconify = "tabler:search"
