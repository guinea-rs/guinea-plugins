[package]
name = "guinea-plugin-store"
description = "Persistent key-value store for guinea applications, backed by amethystate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
guinea.workspace = true
# 0.11.0 is tagged but not on crates.io yet - move back to a version
# requirement once it is published.
amethystate = { git = "https://github.com/uniproc-dev/amethystate", tag = "v0.11.0" }
anyhow.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
guinea = { workspace = true, features = ["test-utils"] }
tempfile = "3.27.0"
