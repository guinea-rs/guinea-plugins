[package]
name = "guinea-plugin-devtools"
description = "Lets guinea devtools look inside a running application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
guinea.workspace = true
guinea-core.workspace = true
guinea-devtools-protocol = { path = "../devtools-protocol" }
guinea-plugin-single-instance = { path = "../single-instance" }
ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.7.2" }
capnp = "0.27"
compio = { version = "0.18.0", features = ["runtime", "time"] }
futures = "0.3.32"
tokio = { version = "1.53", features = ["rt"] }
anyhow.workspace = true
tracing.workspace = true
puffin_http = { version = "0.17", optional = true }
puffin = { version = "0.20", optional = true }

[target.'cfg(windows)'.dependencies]
windows-link = "0.100.0"

[features]
default = []
# The puffin profiler: zones around the same moments the trace marks, and a
# server devtools can be told to start. Nothing runs until it is asked for.
# Off unless asked for: puffin's frame format brings bincode 1, which is
# unmaintained.
profiling = ["dep:puffin_http", "dep:puffin", "guinea-core/profiling"]

[lints]
workspace = true

[dev-dependencies]
guinea = { workspace = true, features = ["test-utils"] }
tokio = { version = "1.53", features = ["rt-multi-thread"] }
