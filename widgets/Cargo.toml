[package]
name = "guinea-widgets"
description = "Tables, charts and drag-resize handles for guinea applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
guinea-mark.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-reactor = { workspace = true, optional = true }
windows-canvas = { workspace = true, features = ["reactor"], optional = true }
windows-core = { workspace = true, optional = true }

# The Direct2D layer a chart clips to its rounded corners with is bound in
# src/chart/d2d.rs (windows-canvas does not wrap one); its mask transform is a
# numerics matrix.
windows-numerics = { version = "0.100.0", optional = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
guinea = { workspace = true, features = ["winui", "harness"] }
anyhow.workspace = true
windows-bindgen = "0.100.0"

[features]
default = ["winui"]

# Backends. Without one, what is left is the part that is pure layout and
# geometry: sort state and ring series.
winui = ["dep:windows-reactor", "dep:windows-canvas", "dep:windows-core", "dep:windows-numerics"]

[lints]
workspace = true
