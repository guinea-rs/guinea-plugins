[package]
name = "guinea-widgets"
description = "Tables, charts and drag-resize handles for guinea applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
guinea-mark.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-reactor = { workspace = true, optional = true }
windows-canvas = { workspace = true, features = ["reactor"], optional = true }
windows-core = { workspace = true, optional = true }

# Direct2D itself, for the one thing the canvas does not wrap: a layer with a
# geometric mask, which is how a chart clips to its rounded corners. The
# windows-rs 0.100 family has no `windows` on crates.io; this is the one guinea
# already links, reached through the canvas's raw device context.
windows = { version = "0.61.3", features = [
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
], optional = true }
d2d-numerics = { package = "windows-numerics", version = "0.2.0", optional = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
guinea = { workspace = true, features = ["winui", "harness"] }
anyhow.workspace = true

[features]
default = ["winui"]

# Backends. Without one, what is left is the part that is pure layout and
# geometry: column sizing, sort/flow state, ring series.
winui = ["dep:windows-reactor", "dep:windows-canvas", "dep:windows-core", "dep:windows", "dep:d2d-numerics"]

[lints]
workspace = true
