[package]
name = "guinea-widgets"
description = "Tables, charts and drag-resize handles for guinea applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", optional = true }
# The canvas moved out of `windows-reactor`'s features and into its own crate's
# `reactor` feature when the reactor was rewritten.
windows-canvas = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", features = [
    "reactor",
], optional = true }
# The lifted stack - the same one `windows-reactor` pins. Charts draw Direct2D
# into a composition surface owned by a WinUI host element, so the widget crate
# names the composition types directly.
windows-composition = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", default-features = false, features = [
    "reactor",
], optional = true }

[features]
default = ["winui"]

# Backends. Without one, what is left is the part that is pure layout and
# geometry: column sizing, sort/flow state, ring series.
winui = ["dep:windows-reactor", "dep:windows-canvas", "dep:windows-composition"]

[lints]
workspace = true
